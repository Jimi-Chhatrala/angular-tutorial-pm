<h1 [style]="'background-color: yellow;'">Hello World</h1>
<hr />
<h1 [style]="'backgroundColor: green;'">Hello Universe</h1>
<hr />
<h1 [style]="'backgroundColor: yellow; color: red;'">Mercury</h1>
<hr />
<h1 [style]="{ color: 'orange', fontFamily: 'cooper' }">Venus</h1>
<hr />
<h1 [style]="myClasses">Earth</h1>
<hr />
<h1 [style.color]="'blue'">Mars</h1>
<hr />
<h1 [style.fontSize]="'120px'">Jupiter</h1>
<hr />
<h1 [style.fontSize.px]="'60'">Saturn</h1>
<hr />
<h1 [style.fontSize]="'80px'" [style.color]="'orange'" [style.fontStyle]="'italic'">Uranus</h1>
<hr />
<h1 [style.color]="condition ? 'red' : ''">Neptune</h1>
<hr />
<h1 [style.color]="10 > 15 ? 'pink' : 'gray'">Pluto</h1>
<hr />
<h1 [ngStyle]="myClasses">Stars</h1>
<hr />
<h1 [ngStyle]="{ color: 'red', fontFamily: 'cooper' }">Commets</h1>
<hr />
<p [ngStyle]="{ color: textColorRed }">Hello Angular</p>
<hr />
<p
  [ngStyle]="{
    color: textColor,
    'background-color': bgColor,
    'font-size': fontSize,
  }"
>
  Hello Angular Framework
</p>
<hr />
<p
  [ngStyle]="{
    color: isError ? 'red' : 'green',
  }"
>
  Status
</p>
<hr />
<button
  [ngStyle]="{
    color: isError ? 'red' : 'black',
    opacity: isDisabled ? 0.5 : 1,
    cursor: isDisabled ? 'not-allowed' : 'pointer',
  }"
>
  Submit
</button>
<hr />
<button (click)="increaseFont()">Increase Font</button>
<p [ngStyle]="{ 'font-size.px': defaultFontSize }">Hello Angular</p>
<hr />
<div
  [ngStyle]="{
    width: '200px',
    height: '100px',
    backgroundColor: 'pink',
  }"
>
  Box 1
</div>
<hr />
<div
  [ngStyle]="{
    width: width + 'px',
    backgroundColor: 'skyblue',
  }"
>
  Box 2
</div>
<hr />
<div [style.width.px]="width" [style.backgroundColor]="'gray'">Box 3</div>
<hr />
<div [ngStyle]="getStyles()">Status: {{ status }}</div>
