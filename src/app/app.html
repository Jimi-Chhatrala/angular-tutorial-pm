<h1 class="myColor myWriting">Hello World</h1>
<hr />
<h1 [className]="'myColor myWriting'">Hello Universe</h1>
<hr />
<h1 [class]="'myColor myWriting'">Hello Earth</h1>
<hr />
<h1 class="myWriting" [className]="'myColor'">Hello Jupiter</h1>
<hr />
<h1 [className]="cssClass">Hello Mercury</h1>
<hr />
<h1 [class.myColor]="condition">Hello Venus</h1>
<hr />
<h1 [class]="myCall()">Hello Mars</h1>
<hr />
<h1 [class]="myConditionalCss()">Hello Saturn</h1>
<hr />
<h1 [class]="condition ? 'myColor' : 'myWriting'">Hello Uranus</h1>
<hr />
<h1 [class]="1 > 0 ? 'myColor' : 'myWriting'">Hello Neptune</h1>
<hr />
<button [class.active]="isActive">Click Me</button>
<hr />
<button class="active">Click Me</button>
<hr />
<p [class.error]="isError">Something went wrong!</p>
<hr />
<p class="error">Something went wrong too!</p>
<hr />
<div [class.active]="isActive" [class.error]="isError" [class.disabled]="isDisabled">Hello</div>
<hr />
<div class="active disabled">Hello</div>
<hr />
<div [class]="myClass">Hello</div>
<hr />
<div class="active">Hello</div>
<hr />
<div [class]="classes">Hello Multiple Classes</div>
<hr />
<button
  type="button"
  [class.selected]="isSelected"
  [class.not-selected]="!isSelected"
  (click)="isSelected = !isSelected"
>
  Click To Switch Colors
</button>
