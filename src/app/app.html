<h1 [ngClass]="'myColor myWriting'">Hello Mercury</h1>
<hr />
<h1 [ngClass]="['myColor', 'myWriting']">Hello Venus</h1>
<hr />
<h1 [ngClass]="{ myColor: false }">Hello Earth</h1>
<hr />
<h1 [ngClass]="{ myWriting: condition }">Hello Mars</h1>
<hr />
<h1 [ngClass]="{ myColor: 10 > 5 }">Hello Jupiter</h1>
<hr />
<h1 [ngClass]="{ myWriting: 0 > 5 }">Hello Saturn</h1>
<hr />
<h1 [ngClass]="{ myColor: true, myWriting: condition }">Hello Uranus</h1>
<hr />
<h1 [ngClass]="cssClass">Hello Neptune</h1>
<hr />
<h1 [ngClass]="cssArray">Hello Pluto</h1>
<hr />
<h1 [ngClass]="myNewClass">Hello World</h1>
<hr />
<h1 ngClass="myColor myWriting">Hello Universe</h1>
<hr />
<div
  [ngClass]="{
    active: status === 'active',
    inactive: status === 'inactive',
    blocked: status === 'blocked',
  }"
>
  User status: {{ status }}
</div>
<hr />
<div [ngClass]="classes">Hello</div>
<hr />
<div [ngClass]="isActive ? 'active' : 'inactive'">Hello</div>
<hr />
<div
  class="card"
  [ngClass]="{
    active: isActive,
    error: isError,
  }"
>
  Hello
</div>
