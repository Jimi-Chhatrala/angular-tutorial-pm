<h1 *ngIf="true">Hello World</h1>

<hr />

<h1 *ngIf="isDisplay">Hello Universe</h1>

<hr />

<h1 *ngIf="trueCondition">True Condition</h1>

<hr />

<h1 *ngIf="falseCondition">False Condition</h1>

<hr />

<h1 *ngIf="ifPart; else elsePart">Mercury If Part</h1>

<ng-template #elsePart>
  <h1>Else Part Mercury</h1>
</ng-template>

<hr />

<div *ngIf="ternaryDisplayCondition; then ternaryIfPart; else ternaryElsePart"></div>

<ng-template #ternaryIfPart>
  <h1>Ternary If Part</h1>
</ng-template>

<ng-template #ternaryElsePart>
  <h1>Ternary Else Part</h1>
</ng-template>

<hr />

<div *ngIf="username == 'Johna'; then ternaryIfUser; else ternaryElseUser"></div>

<ng-template #ternaryIfUser>
  <h1>Ternary If John</h1>
</ng-template>

<ng-template #ternaryElseUser>
  <h1>Ternary Else User</h1>
</ng-template>

<hr />

<h1 *ngIf="fruit === 'Apple'">Your selected fruit is {{ fruit }}.</h1>
<h1 *ngIf="fruit === 'Banana'">Your selected fruit is {{ fruit }}.</h1>
<h1 *ngIf="fruit === 'Carrot'">Your selected fruit is {{ fruit }}.</h1>
