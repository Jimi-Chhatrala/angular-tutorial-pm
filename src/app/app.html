<p>Hello {{ name }}</p>

<hr />
<p>Banana Box - Two Way Data Binding</p>
<input [(ngModel)]="name" placeholder="Banana Box" />

<hr />

<p>Separate Banana and Box - Two Way Data Binding</p>
<input [ngModel]="name" (ngModelChange)="name = $event" placeholder="Separate Banana And Box" />

<hr />

<p>Class to Template Data Binding</p>
<input [value]="name" placeholder="Class to Template" />

<hr />

<p>Template to Class Data Binding</p>
<input (input)="name = $event.target.value" placeholder="Template to Class" />
