<h1>Employees List Page</h1>
<p>employees-list-comp works!</p>

<ul class="list-group">
  <li
    (click)="EmpClick(employee)"
    [class.selected]="isSelected(employee)"
    class="list-group-item"
    *ngFor="let employee of MyEmployees"
  >
    {{ employee.id }} - {{ employee.name }}
  </li>
</ul>
